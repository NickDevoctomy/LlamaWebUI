name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-main-tag:
    name: Verify release tag is on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify semantic tag and main ancestry
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

  ci:
    name: Required CI
    needs: verify-main-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  windows-release:
    name: Windows package and GitHub release
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Validate tag changelog entry
        shell: pwsh
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          python packaging/generate-release-notes.py --tag $tag --output release-notes.md

      - name: Install application dependencies
        run: python -m pip install -e backend

      - name: Build Windows one-folder package
        shell: pwsh
        run: .\packaging\build-windows.ps1 -Output dist -PythonPath (Get-Command python.exe).Source

      - name: Create package archive
        shell: pwsh
        run: Compress-Archive -Path dist\llamawebui -DestinationPath llamawebui-${{ steps.tag.outputs.tag }}-windows-x64.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          gh release create $tag llamawebui-$tag-windows-x64.zip --title "LlamaWebUI $tag" --notes-file release-notes.md --verify-tag
