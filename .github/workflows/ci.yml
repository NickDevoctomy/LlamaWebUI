name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted macOS CI is included for portability coverage. This
        # machine cannot execute the macOS job locally; GitHub Actions is the
        # source of truth for that runner.
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify Windows package definition
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path packaging/windows-package.spec)) { throw 'Windows package spec is missing' }
          if (-not (Test-Path packaging/build-windows.ps1)) { throw 'Windows package script is missing' }

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

      - name: Run Ruff
        working-directory: backend
        run: python -m ruff check .

      - name: Run mypy
        working-directory: backend
        run: python -m mypy src/llamawebui